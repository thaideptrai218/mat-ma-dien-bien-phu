  <title id="title">Bức tranh chiến thắng — minh họa sáng tác cho Mật mã Điện Biên Phủ</title>
  <desc id="description">Lá cờ đỏ sao vàng tung bay trên hầm giữa núi đồi. Người lính và dân công gặp nhau trong ánh sáng chiều. Tranh vector nguyên bản của dự án, không phải ảnh tư liệu hoặc bản sao tranh bảo tàng.</desc>
