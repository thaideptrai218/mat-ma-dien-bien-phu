<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-label="Mỗi hướng tiến công đúng mở một ngón tay của nắm đấm thép" font-size="13" font-family="'Be Vietnam Pro', 'Noto Sans', 'Segoe UI', Roboto, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="atk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5452f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1c">Mỗi hướng tiến công đúng mở một ngón tay của nắm đấm thép</text><text x="24" y="50" font-size="11.5" fill="#5f5d58">Sa bàn Bước 3 · sơ đồ học tập, không theo tỷ lệ · số trong vòng tròn là thứ tự đúng</text><g fill="none" stroke="#9a978f" stroke-width="1.25" stroke-dasharray="5 4"><path d="M500 142H360"></path><path d="M530 174L420 370"></path><path d="M510 174L200 284"></path><path d="M700 174V504H670"></path></g><text x="430" y="134" text-anchor="middle" font-size="11.5" fill="#5f5d58">ngón 1</text><text x="488" y="272" font-size="11.5" fill="#5f5d58">ngón 2</text><text x="340" y="216" text-anchor="middle" font-size="11.5" fill="#5f5d58">ngón 3</text><text x="692" y="330" text-anchor="end" font-size="11.5" fill="#5f5d58">ngón 4</text><g><rect x="500" y="110" width="220" height="64" rx="8" fill="#b5452f" fill-opacity="0.12" stroke="#b5452f" stroke-width="2"></rect><text x="610" y="136" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1e1c">Nắm đấm thép</text><text x="610" y="156" text-anchor="middle" font-size="11.5" fill="#5f5d58">Đồng bằng Bắc Bộ · nơi thứ 1</text></g><g><rect x="200" y="118" width="160" height="48" rx="8" fill="none" fill-opacity="1" stroke="#9a978f" stroke-width="1.25"></rect><text x="280" y="138" text-anchor="middle" font-weight="600" fill="#1f1e1c">Điện Biên Phủ</text><text x="280" y="156" text-anchor="middle" font-size="11.5" fill="#5f5d58">cờ thứ 2 · TÍCH CỰC</text></g><g><rect x="40" y="260" width="160" height="48" rx="8" fill="none" fill-opacity="1" stroke="#9a978f" stroke-width="1.25"></rect><text x="120" y="280" text-anchor="middle" font-weight="600" fill="#1f1e1c">Luông Pha-bang</text><text x="120" y="298" text-anchor="middle" font-size="11.5" fill="#5f5d58">cờ thứ 4 · CƠ ĐỘNG</text></g><g><rect x="300" y="370" width="160" height="48" rx="8" fill="none" fill-opacity="1" stroke="#9a978f" stroke-width="1.25"></rect><text x="380" y="390" text-anchor="middle" font-weight="600" fill="#1f1e1c">Xê-nô</text><text x="380" y="408" text-anchor="middle" font-size="11.5" fill="#5f5d58">cờ thứ 3 · CHỦ ĐỘNG</text></g><g><rect x="510" y="480" width="160" height="48" rx="8" fill="none" fill-opacity="1" stroke="#9a978f" stroke-width="1.25"></rect><text x="590" y="500" text-anchor="middle" font-weight="600" fill="#1f1e1c">Plây-ku</text><text x="590" y="518" text-anchor="middle" font-size="11.5" fill="#5f5d58">cờ thứ 5 · LINH HOẠT</text></g><g fill="none" stroke="#b5452f" stroke-width="2"><path d="M280 94V114" marker-end="url(#atk-arrow)"></path><path d="M380 440V422" marker-end="url(#atk-arrow)"></path><path d="M120 236V256" marker-end="url(#atk-arrow)"></path><path d="M590 454V476" marker-end="url(#atk-arrow)"></path></g><text x="280" y="86" text-anchor="middle" fill="#1f1e1c">① Tây Bắc – Lai Châu · 12/1953</text><text x="380" y="458" text-anchor="middle" fill="#1f1e1c">② Trung Lào – Thà Khẹt · 12/1953</text><text x="120" y="212" text-anchor="middle" fill="#1f1e1c">③ Thượng Lào – Nậm Hu</text><text x="120" y="228" text-anchor="middle" font-size="11.5" fill="#5f5d58">cuối 1/1954</text><text x="590" y="432" text-anchor="middle" fill="#1f1e1c">④ Bắc Tây Nguyên – Kon Tum</text><text x="590" y="448" text-anchor="middle" font-size="11.5" fill="#5f5d58">đầu 2/1954</text><text x="24" y="562" font-size="11.5" fill="#5f5d58">Mũi tên màu: hướng tiến công của ta, đặt theo thứ tự ① → ④ · Nét đứt: xích nối ngón tay với lá cờ Pháp</text></svg>
