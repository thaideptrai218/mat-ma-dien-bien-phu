<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-label="Bước 1 ở bàn Nava, Bước 2 ở lán Việt Bắc, Bước 3 và 4 giữa hành lang" font-size="13" font-family="'Be Vietnam Pro', 'Noto Sans', 'Segoe UI', Roboto, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1c">Bước 1 ở bàn Nava, Bước 2 ở lán Việt Bắc, Bước 3 và 4 giữa hành lang</text><text x="24" y="52" font-size="11.5" fill="#5f5d58">Phòng 2400 × 1440 dùng lại tường phòng hầm hiện có · sơ đồ không theo tỷ lệ chi tiết</text><g><rect x="30" y="80" width="225" height="140" rx="8" fill="#b5452f" fill-opacity="0.12" stroke="#b5452f" stroke-width="2"></rect><text x="42" y="102" font-weight="600" fill="#1f1e1c">Bàn làm việc của Nava</text><text x="42" y="128" font-weight="600" fill="#1f1e1c">◇ Cán cân 84 · Bước 1</text><text x="42" y="150" font-size="11.5" fill="#5f5d58">✧ Sổ kế hoạch 18 tháng</text><text x="42" y="170" font-size="11.5" fill="#5f5d58">● Điểm vào phòng</text></g><g><rect x="265" y="80" width="225" height="140" rx="8" fill="none" fill-opacity="1" stroke="#9a978f" stroke-width="1.25"></rect><text x="277" y="102" font-weight="600" fill="#1f1e1c">Kho tư liệu</text><text x="277" y="128" font-size="11.5" fill="#5f5d58">✧ Tờ lịch tháng 2/1954</text></g><g><rect x="500" y="80" width="221" height="140" rx="8" fill="#b5452f" fill-opacity="0.12" stroke="#b5452f" stroke-width="2"></rect><text x="512" y="102" font-weight="600" fill="#1f1e1c">Lán tham mưu Việt Bắc</text><text x="512" y="128" font-weight="600" fill="#1f1e1c">◇ Điện đài · Bước 2</text><text x="512" y="150" font-size="11.5" fill="#5f5d58">✧ Ghi chú trên điện đài</text></g><g><rect x="30" y="230" width="691" height="96" rx="8" fill="#b5452f" fill-opacity="0.12" stroke="#b5452f" stroke-width="2"></rect><text x="42" y="252" font-weight="600" fill="#1f1e1c">Hành lang</text><text x="709" y="252" text-anchor="end" font-weight="600" fill="#1f1e1c">Cửa ra →</text><text x="300" y="282" text-anchor="middle" font-weight="600" fill="#1f1e1c">◇ Sa bàn · Nắm đấm thép · Bước 3</text><text x="565" y="282" text-anchor="middle" font-weight="600" fill="#1f1e1c">◇ Hòm sắt · Bản đồ gấp · Bước 4</text><text x="565" y="304" text-anchor="middle" font-size="11.5" fill="#5f5d58">✧ Hồ sơ Điện Biên Phủ</text></g><g><rect x="30" y="336" width="225" height="156" rx="8" fill="none" fill-opacity="1" stroke="#9a978f" stroke-width="1.25"></rect><text x="42" y="358" font-weight="600" fill="#1f1e1c">Góc nhật ký</text><text x="42" y="384" font-size="11.5" fill="#5f5d58">✧ Nhật ký chiến sĩ</text></g><g><rect x="265" y="336" width="225" height="156" rx="8" fill="none" fill-opacity="1" stroke="#9a978f" stroke-width="1.25"></rect><text x="277" y="358" font-weight="600" fill="#1f1e1c">Giá báo cũ</text><text x="277" y="384" font-size="11.5" fill="#5f5d58">✧ Trang báo cũ</text></g><g><rect x="500" y="336" width="221" height="156" rx="8" fill="none" fill-opacity="1" stroke="#9a978f" stroke-width="1.25"></rect><text x="512" y="358" font-weight="600" fill="#1f1e1c">Bàn điện báo</text><text x="512" y="384" font-size="11.5" fill="#5f5d58">✧ Điện liên quân Việt – Lào</text></g><text x="24" y="522" font-size="11.5" fill="#5f5d58">◇ trạm câu đố, đi theo Bước 1 → 4 · ✧ manh mối · ô tô màu: gian có trạm câu đố</text></svg>
